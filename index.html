<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bamzy Fx AI - Live Forex Dashboard</title>
    <style>
        body {
            background: #0b0c10;
            color: #fff;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        .section {
            margin-bottom: 30px;
        }
        .news-item, .rate-item {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }
        button {
            background: #1f2833;
            color: #66fcf1;
            border: none;
            padding: 10px 20px;
            margin: 10px 5px;
            cursor: pointer;
        }
        footer {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

<header>
    <h1>🔥 Bamzy Fx AI - Live Forex Dashboard 🔥</h1>
    <button onclick="getForexRates()">Refresh Rates</button>
    <button onclick="getForexNews()">Refresh News</button>
</header>

<div class="section">
    <h2>💱 Live USD Forex Rates</h2>
    <div id="rates">Loading rates...</div>
</div>

<div class="section">
    <h2>📰 Latest Forex News</h2>
    <div id="news">Loading news...</div>
</div>

<footer>
      &copy; 2025 Bamzy Fx Project.  Built With ♥️ by <a href="https://flexi-spec.github.io/Portfolio-/" target="_blank">Flexi Dev Studio</a>
</footer>

<script>
    async function getForexRates() {
        document.getElementById("rates").innerText = "Loading rates...";
        try {
            const res = await fetch("https://open.er-api.com/v6/latest/USD");
            const data = await res.json();
            const container = document.getElementById("rates");
            container.innerHTML = "";
            for (const [currency, rate] of Object.entries(data.rates)) {
                if (["EUR", "GBP", "JPY", "CAD", "NGN"].includes(currency)) {
                    container.innerHTML += `<div class='rate-item'>USD → ${currency}: ${rate}</div>`;
                }
            }
        } catch (error) {
            document.getElementById("rates").innerText = "Error loading rates.";
        }
    }

    async function getForexNews() {
        document.getElementById("news").innerText = "Loading news...";
        try {
            const response = await fetch("https://gnews.io/api/v4/search?q=forex&lang=en&token=8d08dda62d5a1151e46c5446285c21de");
            const data = await response.json();
            const newsContainer = document.getElementById("news");
            newsContainer.innerHTML = "";
            data.articles.forEach(article => {
                newsContainer.innerHTML += `<div class='news-item'><a href='${article.url}' target='_blank'>${article.title}</a><br><small>${article.publishedAt}</small></div>`;
            });
        } catch (error) {
            document.getElementById("news").innerText = "Error loading news.";
        }
    }

    getForexRates();
    getForexNews();
</script>

</body>
</html>
